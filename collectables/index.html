<!doctype html>
<html lang="nl" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Collectables Preview | Sebri Ahmed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a class="btn btn-outline-primary" href="../project-collectables.html">Terug naar portfolio</a>

    <nav class="navbar navbar-expand-lg border-bottom sticky-top bg-body">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Collectables</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collectablesNav" aria-controls="collectablesNav" aria-expanded="false" aria-label="Navigatie openen">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="collectablesNav">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                    <li class="nav-item"><a class="nav-link active" href="#collections">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#details">Details</a></li>
                    <li class="nav-item"><a class="nav-link" href="../project-collectables.html">Info pagina</a></li>
                    <li class="nav-item"><button class="btn btn-outline-secondary btn-sm" type="button" id="themeToggle">Donker</button></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <section class="preview-hero mb-4">
            <div>
                <p class="small text-primary fw-bold text-uppercase mb-2">Static GitHub Pages preview</p>
                <h1 class="h2 mb-2">Verzamelingen</h1>
                <p class="text-secondary mb-0">Ontdek collecties, filter op categorie en bekijk voorbeeld-items. Dit is een HTML/JS-versie van het PHP-project.</p>
            </div>
        </section>

        <form class="row g-2 align-items-center mb-4" id="filterForm">
            <div class="col-12 col-lg">
                <input class="form-control" type="search" id="searchInput" placeholder="Zoek verzamelingen of items">
            </div>
            <div class="col-12 col-md-8 col-lg-3">
                <select class="form-select" id="categorySelect">
                    <option value="">Alle categorieen</option>
                    <option>Romeins</option>
                    <option>Holo Rare</option>
                    <option>Jazz</option>
                    <option>Low</option>
                    <option>SNES</option>
                </select>
            </div>
            <div class="col-12 col-md-4 col-lg-auto">
                <button class="btn btn-outline-primary w-100" type="submit">Zoeken</button>
            </div>
        </form>

        <section id="collections" class="row g-4"></section>

        <section id="details" class="details-panel mt-5">
            <p class="small text-primary fw-bold text-uppercase mb-2">Collectie details</p>
            <div id="detailContent"></div>
        </section>
    </main>

    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
